# TEMPORARY DIAGNOSTIC (revert once the CI hang is captured).
# slf4j-simple config for the pubsub-ali conformance fork. Writes to stdout so lines land in the
# failsafe fork output that Maven streams to the CI console log (readable via gh run view --log).
org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.com.salesforce.multicloudj=debug
org.slf4j.simpleLogger.log.com.github.tomakehurst.wiremock=debug
org.slf4j.simpleLogger.log.wiremock=debug
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
