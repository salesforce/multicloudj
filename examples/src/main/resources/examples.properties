# Configuration for the MultiCloudJ examples.
#
# The examples are substrate agnostic: no key names a cloud, and no example code hardcodes a
# provider id. The *values* decide which substrate an example connects to.
#
# Hardcoding provider ids, regions, credentials, bucket names, account ids and similar values in
# application code is an anti-pattern: it ties the code to a single cloud and environment and
# defeats the portability MultiCloudJ exists to provide.
#
# Any key can be overridden without editing this file:
#   1. JVM system property:     -Dblob.bucket=my-bucket
#   2. Environment variable:    BLOB_BUCKET=my-bucket    (upper case, '.' replaced by '_')
#   3. A local properties file: -Dexamples.config=/path/to/my-examples.properties
#
# Values that still contain a <placeholder> are treated as unset: the example fails fast and names
# the key to set. Empty values mean "not set" and are only allowed for optional keys.

# ---- global connection settings, shared by every example --------------------------------------
# Provider id (environment variable PROVIDER)
provider=gcp
# Region (environment variable REGION); optional for services that do not need one
region=us-west-2
# Optional endpoint and proxy overrides
endpoint=
proxy.endpoint=

# ---- blob (blob.Main) -------------------------------------------------------------------------
blob.bucket=palsfdc
# Destination bucket for the bucket-to-bucket copy example
blob.copy.dest.bucket=destination-bucket

# ---- cross-cloud federation (blob.CrossCloudAwsToGcp) -----------------------------------------
# The workload runs on the source substrate with its ambient identity and accesses a bucket on
# the configured provider through that provider's workload identity federation.
crosscloud.source.provider=aws
crosscloud.source.region=us-west-2
crosscloud.target.bucket=palsfdc
# Full resource name of the target's workload identity federation provider
crosscloud.target.audience=//iam.googleapis.com/projects/599653580068/locations/global/workloadIdentityPools/substrate-sdk/providers/substrate-gcp
# Signed request header (lowercase) in which the target's federation endpoint expects the audience
crosscloud.target.audience.header=x-goog-cloud-target-resource

# ---- sts (sts.Main, sts.CloudNativeAuth) ------------------------------------------------------
# Role / service account assumed by the assume-role examples
sts.role=chameleon@substrate-sdk-gcp-poc1.iam.gserviceaccount.com
# Web identity federation example: an identity token issued by the identity provider is exchanged
# for credentials of sts.federation.role on the configured provider
sts.federation.identity.provider=gcp
sts.federation.audience=multicloudj
sts.federation.role=arn:aws:iam::654654370895:role/chameleon-web
sts.federation.bucket=chameleon-jclouds
# Native-auth signer examples: the request to sign
sts.sign.url=https://sts.us-west-2.amazonaws.com:443
# Optional: request body to sign; empty means no body
sts.sign.body=Action=GetCallerIdentity&Version=2011-06-15

# ---- pubsub (pubsub.Main) ---------------------------------------------------------------------
pubsub.topic=projects/substrate-sdk-gcp-poc1/topics/test-topic
pubsub.subscription=projects/substrate-sdk-gcp-poc1/subscriptions/test-subscription

# ---- docstore (docstore.Main) -----------------------------------------------------------------
# Optional: provider id when it names a database backend rather than the cloud; empty uses the
# global provider
docstore.provider=gcp-firestore
docstore.table=projects/substrate-sdk-gcp-poc1/databases/(default)/documents/docstore-test-1

# ---- dbbackuprestore (dbbackuprestore.Main) ---------------------------------------------------
# Optional: provider id when it names a database backend rather than the cloud; empty uses the
# global provider
dbbackuprestore.provider=gcp-firestore
dbbackuprestore.resource.name=projects/substrate-sdk-gcp-poc1/databases/(default)/documents/docstore-test-1

# ---- iam (iam.Main) ---------------------------------------------------------------------------
iam.tenant.id=projects/substrate-sdk-gcp-poc1
iam.service.account=serviceAccount:multicloudjexample@substrate-sdk-gcp-poc1.iam.gserviceaccount.com
iam.storage.resource=storage://demo-bucket/*
iam.policy.role.name=roles/storage.objectViewer

# ---- registry (registry.Main) -----------------------------------------------------------------
registry.endpoint=<your-registry-endpoint>
registry.repository=<your-repository>
registry.tag=latest
