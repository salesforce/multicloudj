name: zizmor

# Static analysis of GitHub Actions workflows and dependabot.yml for CI/CD security issues
# such as unpinned actions, over-broad token permissions, and template injection.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Findings are reported as PR annotations and fail the job. Uploading SARIF to code
      # scanning instead would need security-events: write, which fork PRs never receive.
      # The zizmor version is pinned so a release adding new audits cannot fail CI unannounced.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.31.1"
          advanced-security: false
          annotations: true
