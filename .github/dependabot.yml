version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Skip versions published less than 7 days ago, so a malicious release is
    # likely to be caught and removed before it is proposed.
    cooldown:
      default-days: 7
    # PR titles become "ci(deps): ..." / "build(deps): ...". The PR Title check
    # only accepts types listed in release-please-config.json.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      - dependency-name: "com.salesforce.multicloudj:*"
    # Grouped so a weekly run yields a few PRs instead of one per artifact. Major
    # bumps stay ungrouped so each breaking upgrade is reviewed on its own.
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
          - "software.amazon.eventstream:*"
        update-types: ["minor", "patch"]
      gcp-sdk:
        patterns:
          - "com.google.cloud:*"
          - "com.google.api:*"
          - "com.google.api-client:*"
          - "com.google.protobuf:*"
          - "io.grpc:*"
        update-types: ["minor", "patch"]
      ali-sdk:
        patterns:
          - "com.aliyun*"
        update-types: ["minor", "patch"]
      other-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
